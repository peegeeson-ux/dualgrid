function fetchPlayerStats(playerId, week){

function fantasyPoints(stats){
  if(!stats || !stats.teams || !stats.teams.length) return null;
  const s = stats.teams[0] && stats.teams[0].statistics && stats.teams[0].statistics[0];
  if(!s) return null;
  const rules = scoringRules || {};
  const r = (k, d) => Number(rules[k]) || d;
  let pts = 0;
  // Passing
  const pYd = Number(s.pass && s.pass.yards) || 0;
  const pTD = Number(s.pass && s.pass.touchdowns) || 0;
  const pInt = Number(s.pass && s.pass.interceptions) || 0;
  pts += pTD * r("ptd", 4);
  pts += pYd * r("pyd", 0.04);
  pts += pInt * r("int", -2);
  if(pYd >= 400) pts += r("pass400", 4);
  else if(pYd >= 300) pts += r("pass300", 3);
  // Rushing
  const rYd = Number(s.rush && s.rush.yards) || 0;
  const rTD = Number(s.rush && s.rush.touchdowns) || 0;
  pts += rTD * r("rtd", 6);
  pts += rYd * r("ryd", 0.1);
  if(rYd >= 200) pts += r("rush200", 4);
  else if(rYd >= 100) pts += r("rush100", 2);
  // Receiving
  const recYd = Number(s.rec && s.rec.yards) || 0;
  const recTD = Number(s.rec && s.rec.touchdowns) || 0;
  const recs = Number(s.rec && s.rec.receptions) || 0;
  pts += recTD * r("rectd", 6);
  pts += recYd * r("recyd", 0.1);
  pts += recs * r("rec", 1);
  if(recYd >= 200) pts += r("rec200", 4);
  else if(recYd >= 100) pts += r("rec100", 2);
  // Fumbles
  const fum = Number(s.fumbles && s.fumbles.lost) || 0;
  pts += fum * r("fumLost", -2);
  if(pts !== 0) return Math.round(pts * 10) / 10;
  return null;
}
function liveLine(stats){
  if(!stats || !stats.teams) return "";
  const s = stats.teams[0] && stats.teams[0].statistics && stats.teams[0].statistics[0];
  if(!s) return "";
  const parts = [];
  if(s.pass){
    const y = Number(s.pass.yards)||0; if(y) parts.push(y+" pass yds");
    const t = Number(s.pass.touchdowns)||0; if(t) parts.push(t+" pass TD");
  }
  if(s.rush){
    const y = Number(s.rush.yards)||0; if(y) parts.push(y+" rush yds");
    const t = Number(s.rush.touchdowns)||0; if(t) parts.push(t+" rush TD");
  }
  if(s.rec){
    const r = Number(s.rec.receptions)||0; if(r) parts.push(r+" rec");
    const y = Number(s.rec.yards)||0; if(y) parts.push(y+" rec yds");
    const t = Number(s.rec.touchdowns)||0; if(t) parts.push(t+" rec TD");
  }
  return parts.length ? parts.join(" · ") : "";
}

function loadBoxCache(){

    const done = (games||[]).filter(g => g.game && (g.game.status.short === "Completed" || g.game.status.short === "Live - In Progress"));
    return Promise.all(done.map(g => {
      const id = g.game.id;
      if(boxCache[id]) return Promise.resolve();
      return fetch("https://dualgrid-players.peegeeson.workers.dev/box?game="+encodeURIComponent(id), {cache:"no-store"})
        .then(r=>r.json()).then(d => {
          (d.response||[]).forEach(p => {
            const name = (p.player && p.player.name)||"";
            if(name){
              const k = name.toLowerCase();
              boxCache[k] = p;
              // Defenses by abbreviation
              if(k.includes(" defense")){
                const abv = k.split(" ")[0];
                boxCache[abv] = p;
                boxCache[abv + " defense"] = p;
              }
              // Save points history
              const pts = fantasyPoints(p);
              if(pts != null){
                const hist = JSON.parse(localStorage.getItem("playerHistory")||"{}");
                const wk = String(currentNflWeek());
                if(!hist[k]) hist[k] = {};
                hist[k][wk] = pts;
                localStorage.setItem("playerHistory", JSON.stringify(hist));
              }
            }
          });
        }).catch(()=>{});
    }));
  });
}
function fillLiveStats(){
  const week = String(currentNflWeek());
  const seen = new Set();
  const els = document.querySelectorAll(".live-pts, .live-line");
  console.log("fillLiveStats", els.length, "elements, boxCache", Object.keys(boxCache).length);
  els.forEach(el => {
    const id = el.getAttribute("data-id");
    if(!id || seen.has(id)) return;
    seen.add(id);
    let p = enrich({id:Number(id)});
    if(!p || !p.name || p.name === "—"){
      // try by name from the nearby name element
      const nameEl = el.closest("div") && el.closest("div").querySelector(".name");
      const nm = nameEl ? nameEl.textContent.replace(/[^a-zA-Z ]/g,"").trim() : "";
      if(nm) p = enrich({name:nm});
    }
    if(!p || !p.name || p.name === "—") return;
    const ptsEls = document.querySelectorAll('.live-pts[data-id="'+id+'"]');
    const lineEls = document.querySelectorAll('.live-line[data-id="'+id+'"]');
    // Always show projection as fallback, then live if available
    const proj = (p.projWeek && Number(p.projWeek) > 0) ? Number(p.projWeek) : null;
    const wk = (p.weeks && p.weeks[week] != null && Number(p.weeks[week]) > 0) ? Number(p.weeks[week]) : null;
    const fallback = (wk != null) ? wk : (proj != null ? proj : "—");
    // Show projection until real live data arrives for this week
    const hasLive = livePts[id] != null && livePts[id+"_wk"] == week;
    if(hasLive){
      ptsEls.forEach(el => el.textContent = livePts[id]);
      lineEls.forEach(el => el.textContent = "Live");
    } else {
      ptsEls.forEach(el => el.textContent = fallback);
      lineEls.forEach(el => { if(!el.textContent) el.textContent = (proj != null ? "Proj" : ""); });
    }
    updateMatchupTotals(); updateRosterTotal(); fillGameScores();
    // Prefer live box score data if we already have it
    const key = (p.name||"").toLowerCase().trim();
    let cached = boxCache[key];
    if(!cached){
      const isDef = /def|dst|defense/i.test(p.pos||"") || /def|dst|defense/i.test(p.name||"") || /def|dst|defense/i.test(p.name||"");
      if(isDef){
        const clean = key.replace(/ defense| dst| def/g,"").trim();
        const abv = (TEAM_ABV[clean] || TEAM_ABV[key] || "").toLowerCase();
        if(abv){
          cached = boxCache[abv] || boxCache[abv + " defense"] || boxCache[abv + " def"];
          console.log("def match", key, "->", abv, cached ? "HIT" : "miss");
        }
      }
      if(!cached){
        const parts = key.split(" ");
        const last = parts.pop();
        const first = parts[0] || "";
        for(const k in boxCache){
          const kParts = k.split(" ");
          const kLast = kParts.pop();
          const kFirst = kParts[0] || "";
          // Require both first and last name to match
          if(kLast === last && kFirst === first){
            cached = boxCache[k];
            break;
          }
        }
        if(!cached) console.log("no match for", key);
        if(key.includes("maye")) console.log("MAYE check", key, "cached:", !!cached, "boxCache keys sample:", Object.keys(boxCache).filter(k=>k.includes("maye")));
      }
    }
    if(cached){
      const pts = fantasyPoints(cached);
      const line = liveLine(cached);
      if(line){
        const show = pts != null ? pts : 0;
        ptsEls.forEach(el => { el.textContent = show; el.setAttribute("data-live","1"); });
        livePts[id] = show;
        livePts[id+"_wk"] = week;
        lineEls.forEach(el => el.textContent = line);
        updateMatchupTotals();
      }
    }
    // Live stats are optional — only replace if real data arrives and we don't already have a live number
    if(livePts[id] != null) return;
    findApiId(p.name).then(apiId => {
      if(!apiId) return;
      fetchPlayerStats(apiId, week).then(stats => {
        const pts = fantasyPoints(stats);
        if(pts != null && pts > 0){
          if(ptsEl){ ptsEl.textContent = pts; livePts[id] = pts; }
          if(lineEl) lineEl.textContent = liveLine(stats) || "Live";
          updateMatchupTotals();
        }
      });
    });
  });
}

function updateMatchupTotals(){

function gameDate(g){
  const id = (g && g.game && g.game.id) || "";
  const m = id.match(/^(\d{8})/);
  if(!m) return null;
  const s = m[1];
  return new Date(s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8)+"T12:00:00");
}
function isCurrentWeekGame(g){
  const id = (g && g.game && g.game.id) || "";
  const m = id.match(/^(\d{8})/);
  if(!m) return false;
  const gameDay = m[1]; // YYYYMMDD
  const now = new Date();
  const et = new Date(now.toLocaleString("en-US", {timeZone:"America/New_York"}));
  const day = et.getDay();
  const daysSinceThu = (day + 3) % 7;
  const start = new Date(et);
  start.setDate(start.getDate() - daysSinceThu);
  const startStr = start.getFullYear() + String(start.getMonth()+1).padStart(2,"0") + String(start.getDate()).padStart(2,"0");
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  const endStr = end.getFullYear() + String(end.getMonth()+1).padStart(2,"0") + String(end.getDate()).padStart(2,"0");
  return gameDay >= startStr && gameDay < endStr;
}
function currentNflWeek(){
  // Flip to next week every Tuesday at 2pm ET
  // Week 1 starts Thursday Sept 10, 2026
  const now = new Date();
  const et = new Date(now.toLocaleString("en-US", {timeZone:"America/New_York"}));
  const seasonStart = new Date("2026-09-10T00:00:00-04:00");
  const ms = et - seasonStart;
  const days = Math.floor(ms / 86400000);
  let week = Math.floor(days / 7) + 1;
  // Stay on the current week until Tuesday 2pm after the Monday night game
  const day = et.getDay(); // 0=Sun, 2=Tue
  const hour = et.getHours();
  if(day === 2 && hour >= 14) week += 1;
  if(day > 2 && day < 5) week += 1; // Wed/Thu only
  if(week < 1) week = 1;
  if(week > 18) week = 18;
  // Clear old caches when the week changes
  if(window._lastWeek && window._lastWeek !== week){
    boxCache = {};
    Object.keys(livePts).forEach(k => delete livePts[k]);
    nflGamesCache = null;
  }
  window._lastWeek = week;
  return week;
}
function applyWeekResults(s){
  if(!s.records) s.records = {week:1, rows:{}};
  if(!s.records.rows) s.records.rows = {};
  if(!s.records.weekScores) s.records.weekScores = {};
  const week = Number(s.records.week)||1;
  const schedule = seasonSchedule(s);
  const games = schedule[week-1]||[];
  const weekKey = "w"+week;
  if(!s.records.weekScores[weekKey]) s.records.weekScores[weekKey] = {};
  games.forEach(g=>{
    if(!g.home||!g.away||g.home.name==="BYE"||g.away.name==="BYE") return;
    const homeKey = g.pod+"-"+g.home.id;
    const awayKey = g.pod+"-"+g.away.id;
    const nflWeek = String(currentNflWeek());
    const homePts = (g.home.lineup&&g.home.lineup.starters||[]).reduce((sum,p)=>{
      const live = (livePts[p.id]!=null && livePts[p.id+"_wk"]==nflWeek) ? Number(livePts[p.id]) : null;
      return sum + (live!=null ? live : (enrich(p).projWeek||0));
    },0);
    const awayPts = (g.away.lineup&&g.away.lineup.starters||[]).reduce((sum,p)=>{
      const live = (livePts[p.id]!=null && livePts[p.id+"_wk"]==nflWeek) ? Number(livePts[p.id]) : null;
      return sum + (live!=null ? live : (enrich(p).projWeek||0));
    },0);
    if(!s.records.rows[homeKey]) s.records.rows[homeKey]={w:0,l:0,pf:0,pa:0};
    if(!s.records.rows[awayKey]) s.records.rows[awayKey]={w:0,l:0,pf:0,pa:0};
    const hr = s.records.rows[homeKey], ar = s.records.rows[awayKey];
    hr.pf = (Number(hr.pf)||0) + homePts;
    hr.pa = (Number(hr.pa)||0) + awayPts;
    ar.pf = (Number(ar.pf)||0) + awayPts;
    ar.pa = (Number(ar.pa)||0) + homePts;
    if(homePts > awayPts){ hr.w=(Number(hr.w)||0)+1; ar.l=(Number(ar.l)||0)+1; }
    else if(awayPts > homePts){ ar.w=(Number(ar.w)||0)+1; hr.l=(Number(hr.l)||0)+1; }
    s.records.weekScores[weekKey][homeKey] = {pf:homePts, pa:awayPts, opp:awayKey};
    s.records.weekScores[weekKey][awayKey] = {pf:awayPts, pa:homePts, opp:homeKey};
  });
}

  modal.style.cssText = "position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center";
  modal.onclick = ()=>modal.remove();
  const card = document.createElement("div");
  card.className = "card";
  card.style.cssText = "max-width:360px;width:90%;max-height:80vh;overflow:auto";
  card.onclick = ev=>ev.stopPropagation();
  const opp = playerOpp(p) || "—";
  const past = e.weeks ? Object.keys(e.weeks).sort((a,b)=>Number(a)-Number(b)).map(w=>'<span style="margin-right:8px">Wk '+w+': '+(e.weeks[w]||"—")+'</span>').join("") : "";
  card.innerHTML = '<h2>'+name+injuryBadge(name)+'</h2><p style="font-size:15px;margin:4px 0"><strong>'+pos+' · '+team+'</strong> · <span style="color:#69be28">'+opp+'</span></p><p style="opacity:.8;margin:4px 0">Season proj: '+(e.proj||"—")+' · Week '+week+' proj: '+(e.projWeek||"—")+'</p>'+(past?'<p style="font-size:12px;opacity:.7;margin:4px 0">'+past+'</p>':'')+'<div id="live-card-stats" style="margin-top:10px;font-size:13px;color:#7cc8ff;min-height:40px">Loading stats…</div><div id="card-history" style="margin-top:10px;font-size:12px;opacity:.8"></div><div id="card-schedule" style="margin-top:10px;font-size:12px;opacity:.8">Loading schedule…</div><button class="btn btn-lime" style="margin-top:12px;margin-right:8px" onclick="dropPlayer('+p.id+')">Drop</button><button class="btn" style="margin-top:12px" onclick="this.closest(\'div\').parentElement.remove()">Close</button>';
  modal.appendChild(card);
  document.body.appendChild(modal);
  const box = card.querySelector("#live-card-stats");
  const showStats = () => {
    const key = name.toLowerCase().trim();
    const cached = boxCache[key];
  if(cached){
    const pts = fantasyPoints(cached);
    const line = liveLine(cached);
    if(line){
      box.innerHTML = '<strong style="color:#69be28">Week '+week+': '+(pts!=null?pts+' pts':'—')+'</strong><div style="margin-top:4px;font-size:12px">'+line+'</div>';
    } else if(pts != null && pts > 0){
      box.innerHTML = '<strong style="color:#69be28">Week '+week+': '+pts+' pts</strong>';
    } else {
      box.innerHTML = '<span style="opacity:.7">No live stats yet · Proj: '+(e.projWeek||"—")+'</span>';
    }
  } else {
    box.innerHTML = '<span style="opacity:.7">No live stats yet · Proj: '+(e.projWeek||"—")+'</span>';
  }
  };
  if(Object.keys(boxCache).length) showStats();
  else loadBoxCache().then(showStats);
  // Schedule
  const histBox = card.querySelector("#card-history");
  if(histBox){
    const hist = JSON.parse(localStorage.getItem("playerHistory")||"{}");
    const key = name.toLowerCase().trim();
    const weeks = hist[key] || hist[key.split(" ").pop()] || {};
    const keys = Object.keys(weeks).sort((a,b)=>Number(a)-Number(b));
    if(keys.length){
      histBox.innerHTML = '<strong>Past weeks:</strong> ' + keys.map(w=>'<span style="margin-right:8px">Wk '+w+': '+weeks[w]+'</span>').join("");
    }
  }
  const schedBox = card.querySelector("#card-schedule");
  if(schedBox && team){
    const abv = {"WAS":"WSH","WSH":"WSH"}[team] || team;
    fetch("https://dualgrid-players.peegeeson.workers.dev/schedule").then(r=>r.json()).then(d=>{
      const sched = (d.response && (d.response[abv] || d.response[team] || d.response["WSH"])) || {};
      const weeks = Object.keys(sched).sort((a,b)=>Number(a)-Number(b));
      if(weeks.length){
        schedBox.innerHTML = weeks.map(w=>'<span style="margin-right:8px">Wk '+w+': '+(sched[w].opponent||"—")+'</span>').join("");
      } else {
        schedBox.textContent = "No schedule";
      }
    }).catch(()=>{ schedBox.textContent = "Schedule unavailable"; });
  }
}

function enrich(p){
  if(!p || !p.id) return p;
  const full = PLAYERS.find(x => Number(x.id) === Number(p.id));
  if(!full) return p;
  return Object.assign({}, p, { name: full.name, pos: full.pos, proj: full.proj || 0, projWeek: full.projWeek || 0, points: full.points, weeks: full.weeks });
}


async function loadFantasyProsPlayers(attempt) {
  attempt = attempt || 1;
  window.PLAYERS_ERROR = attempt > 1 ? "retrying..." : "";
  try {
    const res = await fetch("https://dualgrid-players.peegeeson.workers.dev?v="+Date.now(), {cache:"no-store", mode:"cors"});
    if (!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    if (data.players && data.players.length) {
      PLAYERS = data.players;
      console.log("Loaded", PLAYERS.length, "players from FantasyPros");
      window.PLAYERS_LIVE = true;
      window.PLAYERS_ERROR = "";
      if (window._paint) window._paint();
      const page = (location.hash||"").replace("#","").split("/")[0];
      if (page !== "matchup" && typeof route === "function") route();
      setTimeout(()=>{ if(window._paint) window._paint(); }, 500);
    } else {
      throw new Error("No players in response");
    }
  } catch (e) {
    const msg = String(e && e.message || e);
    console.log("FantasyPros attempt", attempt, "failed", msg);
    if (attempt < 3) {
      setTimeout(()=>loadFantasyProsPlayers(attempt+1), 800);
      return;
    }
    window.PLAYERS_LIVE = false;
    window.PLAYERS_ERROR = "load failed";
    if (window._paint) window._paint();
    if (typeof route === "function") route();
  }
}
loadFantasyProsPlayers();
window.reloadPlayers = function(){ loadFantasyProsPlayers(1); };

function snakeSlot(i,draft){
  const n = teamCount();
  const r = Math.floor(i / n), p = i % n;
  let order = null;
  if (draft && draft.order) {
    const raw = Array.isArray(draft.order) ? draft.order : Object.values(draft.order);
    const nums = raw.map(Number).filter(x => !isNaN(x));
    if (nums.length === n) order = nums;
  }
  const teamId = order
    ? (r % 2 === 0 ? order[p] : order[n - 1 - p])

function restrictedPositions(team, rs, roundsLeft){
  if(!team || !team.picks) return null;
  rs = rs || window.rosterSettings || {};
  const need = {QB:Number(rs.qb)||1, RB:Number(rs.rb)||2, WR:Number(rs.wr)||2, TE:Number(rs.te)||1, K:Number(rs.k)||1, DEF:Number(rs.teamDef)||1};
  const have = {QB:0,RB:0,WR:0,TE:0,K:0,DEF:0};
  team.picks.forEach(p=>{
    const pos = (p.pos||"").toUpperCase();
    if(have.hasOwnProperty(pos)) have[pos]++;
    else if(pos==="DST"||pos==="DEF") have.DEF++;
  });
  const missing = [];
  Object.keys(need).forEach(pos=>{ if(have[pos] < need[pos]) missing.push(pos); });
  if(missing.length && roundsLeft <= missing.length + 1) return missing;
  return null;
}

function bulbs(text){return String(text||"").toUpperCase().split("").map(ch=>'<span class="bulb '+(ch.trim()?"on":"")+'">'+(ch===" "?"·":ch)+'</span>').join("");}

function roundRobin(ids){
const list=ids.slice();
if(list.length%2)list.push("BYE");
const n=list.length, rounds=[], rot=list.slice();
for(let r=0;r<n-1;r++){
  const games=[];
  for(let i=0;i<n/2;i++)games.push([rot[i],rot[n-1-i]]);
  rounds.push(games);
  rot.splice(1,0,rot.pop());
}
return rounds;
}
function seasonSchedule(s){
const pods=podsOf(s);
const mode=(s.records&&s.records.board&&s.records.board.scope)||"division";
if(mode==="league"){
  const teams=[];
  pods.forEach(pod=>ensureDraft(s,pod).teams.forEach(team=>teams.push(Object.assign({pod},team))));
  const built=roundRobin(teams.map(t=>t.pod+"-"+t.id)); const weeks=[]; for(let i=0;i<seasonGames;i++)weeks.push(built[i%Math.max(1,built.length)]||[]); return weeks.map(week=>week.map(pair=>{
    const find=key=>{const [pod,id]=String(key).split("-"); return key==="BYE"?{name:"BYE",id:"BYE"}:ensureDraft(s,pod).teams.find(t=>Number(t.id)===Number(id))||{name:"BYE"};};
    return {home:find(pair[0]),away:find(pair[1]),pod:"league"};
  }));
}
const weeks=[];
pods.forEach(pod=>{
  const teams=ensureDraft(s,pod).teams;
  roundRobin(teams.map(t=>t.id)).forEach((round,i)=>{
    weeks[i]=weeks[i]||[];
    round.forEach(pair=>{
      const home=teams.find(t=>Number(t.id)===Number(pair[0]))||{name:"BYE"};
      const away=teams.find(t=>Number(t.id)===Number(pair[1]))||{name:"BYE"};
      weeks[i].push({pod,home,away});
    });
  });
});
const out=[]; for(let i=0;i<seasonGames;i++)out.push(weeks[i%Math.max(1,weeks.length)]||[]); return out;
}

function saveWaiverDeadline(){const s=waiverState(); if(!s.owner){alert("Unlock first."); return;} s.records.waiverDeadline=document.getElementById("waiver-deadline").value; saveWaiver(s); renderWaiver();}
function filterWaiver(v){const s=waiverState(); s.records.waiverQ=v; save(s); renderWaiver();}
function addWaiver(id){
  const s = waiverState();
  const rec = s.records;
  const closed = !!(rec.waiverDeadline && Date.now() > new Date(rec.waiverDeadline).getTime());
  const player = PLAYERS.find(p => p.id === Number(id));
  if(!player){ alert("Player not found."); return; }
  const pod = window.waiverPod || "east";
  rec.claims = rec.claims || [];
  if(rec.claims.some(c => c.id === player.id && c.pod === pod)){ alert("Already claimed."); return; }
  let targetTeam = null;
  const d = ensureDraft(s, pod);
  (d.teams||[]).forEach(team => {
    const overrideOn = localStorage.getItem("dualgrid-override-"+pod+"-"+team.id) === "1";
    if(s.owner && overrideOn) targetTeam = team;
    else if(!s.owner && canEditTeam(s, pod, team.id)) targetTeam = team;
  });
  if(!targetTeam){ alert("Turn on Commissioner override for the team that is claiming."); return; }
  rec.claims.unshift({id:player.id, player:player.name, kind:closed?"fa":"waiver", at:Date.now(), pod:pod, teamId:targetTeam.id, team:targetTeam.name});
  saveWaiver(s);
  renderWaiver();
  alert(player.name + " claimed by " + targetTeam.name + ".");
}
function awardClaim(id, teamId){
  const s = waiverState();
  const rec = s.records;
  const pod = window.waiverPod || "east";
  const player = PLAYERS.find(p => p.id === Number(id));
  if(!player){ alert("Player not found."); return; }
  const d = ensureDraft(s, pod);
  const team = (d.teams||[]).find(t => Number(t.id) === Number(teamId));
  if(!team){ alert("Team not found."); return; }
  team.picks = team.picks || [];
  if(!team.picks.some(p => Number(p.id) === Number(player.id))){
    team.picks.push({id:player.id, name:player.name, pos:player.pos});
  }
  team.lineup = team.lineup || {starters:[], bench:[], ir:[]};
  team.lineup.bench = team.lineup.bench || [];
  if(!team.lineup.bench.some(p => Number(p.id) === Number(player.id))){
    team.lineup.bench.push({id:player.id, name:player.name, pos:player.pos});
  }
  try{ dataRef("drafts/"+pod+"/teams/"+team.id+"/lineup").set(team.lineup); }catch(e){}
  try{ dataRef("drafts/"+pod+"/teams/"+team.id+"/picks").set(team.picks); }catch(e){}
  publish(pod);
  rec.claims = (rec.claims||[]).filter(c => !(c.id === player.id && c.pod === pod));
  saveWaiver(s);
  renderWaiver();
  alert(player.name + " awarded to " + team.name + ".");
}



function movePlayer(pod, teamId, playerId, to){
  try{
    const st=load();
    const tid=Number(teamId);
    const overrideOn = localStorage.getItem("dualgrid-override-"+pod+"-"+tid)==="1";
    const can = canEditTeam(st, pod, tid) && (!st.owner || overrideOn); if(!can){ alert("Turn on Commissioner override to edit this team."); return; }
    const d=ensureDraft(st,pod);
    const team=d.teams[tid];
    if(!team){ return; }
    const pl=(team.picks||[]).find(p=>Number(p.id)===Number(playerId));
    if(!pl){ return; }
    const lineup = {starters:[],bench:[],ir:[]};
    const existing = team.lineup || {};
    lineup.starters = (existing.starters||[]).filter(p=>Number(p.id)!==Number(playerId));
    lineup.bench = (existing.bench||[]).filter(p=>Number(p.id)!==Number(playerId));
    lineup.ir = (existing.ir||[]).filter(p=>Number(p.id)!==Number(playerId));
    if(to==="starter"){
      const isFlex = ["RB","WR","TE"].includes(pl.pos);
      const alreadyFlex = lineup.starters.filter(p=>["RB","WR","TE"].includes(p.pos)).length > ((window.rosterSettings||{}).rb||0)+((window.rosterSettings||{}).wr||0)+((window.rosterSettings||{}).te||0);
      if(!isFlex && alreadyFlex){ alert("Flex is RB/WR/TE only."); return; }
      lineup.starters.push(pl);
    }
    else if(to==="ir") lineup.ir.push(pl);
    else lineup.bench.push(pl);
    team.lineup = lineup;
    save(st);
    publish(pod);
    renderRoster();
  }catch(e){ alert("error: "+e.message); }
}

      const pl=all.find(p=>Number(p.id)===id);

      team.lineup.bench=(team.lineup.bench||[]).filter(p=>Number(p.id)!==id);
      team.lineup.ir=(team.lineup.ir||[]).filter(p=>Number(p.id)!==id);
      if(to==="starter") team.lineup.starters.push(pl);
      else if(to==="ir") team.lineup.ir.push(pl);
      else team.lineup.bench.push(pl);
      // fail-safe check when moving to starter
      if(to==="starter" || true){

        if(!check.ok && !st.owner){
          alert("Must start requirements not met: " + check.missing.join(", "));

        }

function validateMustStart(starters, rs){
  const counts = {QB:0,RB:0,WR:0,TE:0,K:0,DEF:0,FLEX:0};
  (starters||[]).forEach(p=>{
    const pos = p.pos||"";
    if(counts.hasOwnProperty(pos)) counts[pos]++;
    else if(pos==="DST" || pos==="DEF") counts.DEF++;
    else counts.FLEX++;
  });
  const missing = [];
  if(counts.QB < (rs.qb||0)) missing.push("QB");
  if(counts.RB < (rs.rb||0)) missing.push("RB");
  if(counts.WR < (rs.wr||0)) missing.push("WR");
  if(counts.TE < (rs.te||0)) missing.push("TE");
  if(counts.K < (rs.k||0)) missing.push("K");
  if(counts.DEF < (rs.teamDef||0)) missing.push("DEF");
  return {ok: missing.length===0, missing};
}

function loadWeekTicker(){
  const ticker = document.getElementById("week-ticker");
  if(!ticker) return;
  const hash = location.hash.replace("#","") || "";
  const page = hash.split("/")[0] || "";
  const inLeague = !!leagueCode();
  if(!inLeague || page === "login" || page === "lobby" || page === "matchup" || page === "draft" || page === "board"){ 
    ticker.style.display = "none"; 
    return; 
  }
  ticker.style.display = "block";
  ticker.onclick = ()=>{ location.hash = "#matchup"; };

  try {
    const s = load(); // always fresh for the current league
    const week = (s.records && s.records.week) || 1;
    const schedule = (typeof seasonSchedule === "function") ? seasonSchedule(s) : [];
    const games = schedule[week-1] || [];
    if(!games.length){
      ticker.innerHTML = '<span>No matchups this week</span>';
      return;
    }
    const text = games.map(g => {
      const h = (g.home && g.home.name) || "Home";
      const a = (g.away && g.away.name) || "Away";
      const sumLive = (starters) => (starters||[]).reduce((sum,pl)=>{
        const e = enrich(pl); const id = e.id;
        if(id && livePts[id] != null) return sum + livePts[id];
        const key = (e.name||"").toLowerCase().trim();
        const c = boxCache[key]; return sum + (c ? (fantasyPoints(c)||0) : 0);
      },0);
      const hPts = sumLive(g.home && g.home.lineup && g.home.lineup.starters);
      const aPts = sumLive(g.away && g.away.lineup && g.away.lineup.starters);
      const live = (hPts || aPts) ? " " + aPts.toFixed(1) + "-" + hPts.toFixed(1) : "";
      return a + " vs " + h + live;
    }).join("   ·   ");
    ticker.innerHTML = '<span>Week ' + week + ': ' + text + '</span>';
    if(!window._tickerLoaded && typeof loadBoxCache === "function"){
      window._tickerLoaded = true;
      loadBoxCache().then(()=>setTimeout(loadWeekTicker, 800)).catch(()=>{});
    }
  } catch(e){
    ticker.innerHTML = '<span>Matchups loading…</span>';
  }
}

function injuryBadge(name){
  if(!injuryCache || !name) return "";
  const n = name.toLowerCase().trim();
  const hit = injuryCache.find(p => {
    const pn = (p.name||"").toLowerCase().trim();
    if(!pn) return false;
    return pn === n || pn.includes(n) || n.includes(pn);
  });
  if(!hit) return "";
  const st = (hit.status||"").toUpperCase();
  const cls = st.includes("OUT")||st.includes("IR") ? "OUT" : st.includes("Q") ? "Q" : st.includes("PUP") ? "PUP" : "";
  return `<span class="injury-badge ${cls}" title="${hit.description||hit.status}">${hit.status||"INJ"}</span>`;
}

  if(!(h.startsWith("#draft")||h.startsWith("#board"))) return;
  const pod=podFromHash();
  const d=ensureDraft(load(),pod);
  const o=document.getElementById("draft-countdown");
  if(d.countdown==null){ if(o) o.remove(); return; }
  if(!o) showCountdownOverlay(pod);
},500);}

// Auto-start countdown when scheduled draft time is reached
function checkScheduledDrafts(){
  dataRef("config/draftTimes").once("value").then(snap=>{
    const times=snap.val()||{};
    // raw log removed
    const now=new Date();
    Object.keys(times).forEach(pod=>{
      const t=times[pod];
      if(!t || !t.date || !t.time) return;
      const [y,m,d]= (t.date||"").split("-").map(Number);
      const [hh,mm]= (t.time||"").split(":").map(Number);
      if(!y || !m || !d) return;
      const scheduled=new Date(y, m-1, d, hh||0, mm||0, 0, 0);
      const st=load();
      const draft=ensureDraft(st,pod);
      const recent = (now - scheduled) < 120000;
      const lock = localStorage.getItem("autoStart_"+pod);
      console.log(pod, "check:", "now>=", now>=scheduled, "recent:", recent, "lock:", lock, "countdown:", draft.countdown);
      if(now >= scheduled && recent && !lock && (!draft.picks || draft.picks.length===0)){
        localStorage.setItem("autoStart_"+pod, "1");
        startDraftCountdown(pod);
      }
    });
  }).catch(()=>{});
}
if(!window._scheduleWatch){
  window._scheduleWatch=setInterval(checkScheduledDrafts, 15000);
  setTimeout(checkScheduledDrafts, 1500);
}
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("#go-home"); if(!a)return; e.preventDefault(); location.hash="#home"; renderHome();});
document.addEventListener("click",e=>{if(e.target&&e.target.id==="menu-btn"){const n=document.querySelector(".nav-links"); if(n)n.classList.toggle("open");}});
document.addEventListener("click",e=>{if(e.target&&e.target.id==="logout-btn"){e.preventDefault(); const st=load(); st.email=""; delete st.email; save(st); localStorage.removeItem("dualgrid-email"); location.href=location.pathname+"?out="+Date.now();}});
document.addEventListener("click",e=>{const btn=e.target.closest&&e.target.closest("#logout-btn"); if(!btn)return; e.preventDefault(); const st=load(); delete st.email; st.email=""; save(st); location.replace(location.pathname+"#lobby");});
window.addEventListener("hashchange", route);
// live pick clock tick
if(!window._clockTick){
  window._clockTick = setInterval(()=>{
    const h = location.hash || "";
    if(!h.startsWith("#draft") && !h.startsWith("#board")) return;
    const el = document.querySelector(".timer");
    if(!el) return;
    const pod = (h.split("/")[1]||"east").toLowerCase();
    const st = load();
    const d = st.drafts && st.drafts[pod];
    if(!d || d.paused) return;
    const left = clockLeft(d);
    el.textContent = fmtTime(left);
  }, 1000);
}
// remove any stuck countdown overlay
setTimeout(()=>{ const o=document.getElementById("draft-countdown"); if(o) o.remove(); }, 500);
setTimeout(loadWeekTicker, 300);
setTimeout(loadNflTicker, 400);
setTimeout(()=>loadInjuries(false), 800);

dataRef("drafts").on("value", snap => {
  const s = load();
  const all = snap.val() || {};
  Object.keys(all).forEach(pod => {
    const d = ensureDraft(s, pod);
    const remote = all[pod] || {};
    const teams = remote.teams || {};
    Object.keys(teams).forEach(tid => {
      const t = d.teams.find(x => x.id === Number(tid));
      if(t && teams[tid].lineup) t.lineup = teams[tid].lineup;
    });
    if(remote.countdown != null){
      d.countdown = remote.countdown;
      d.countdownStart = remote.countdownStart || Date.now();
      save(s);
    }
  });
  save(s);
  if(location.hash.startsWith("#roster")) renderRoster();
});

function openPlayerFromEvent(ev){
  const el = ev.target.closest(".name[data-player-id]");
  if(!el) return;
  if(ev.target.closest("button")) return;
  const id = el.getAttribute("data-player-id");
  const p = (PLAYERS||[]).find(x=>String(x.id)===String(id)) || {id:Number(id), name: el.textContent || "Player"};
  if(typeof showPlayerModal === "function"){
    if(ev.cancelable) ev.preventDefault();
    showPlayerModal(p);
  }
}
document.addEventListener("click", openPlayerFromEvent);
document.addEventListener("touchend", openPlayerFromEvent, {passive:false});

</script>

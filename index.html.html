function bulbs(text){return String(text||"").toUpperCase().split("").map(ch=>'<span class="bulb '+(ch.trim()?"on":"")+'">'+(ch===" "?"·":ch)+'</span>').join("");}

function roundRobin(ids){
const list=ids.slice();
if(list.length%2)list.push("BYE");
const n=list.length, rounds=[], rot=list.slice();
for(let r=0;r<n-1;r++){
  const games=[];
  for(let i=0;i<n/2;i++)games.push([rot[i],rot[n-1-i]]);
  rounds.push(games);
  rot.splice(1,0,rot.pop());
}
return rounds;
}
function seasonSchedule(s){
const pods=podsOf(s);
const mode=(s.records&&s.records.board&&s.records.board.scope)||"division";
if(mode==="league"){
  const teams=[];

  const built=roundRobin(teams.map(t=>t.pod+"-"+t.id)); const weeks=[]; for(let i=0;i<seasonGames;i++)weeks.push(built[i%Math.max(1,built.length)]||[]); return weeks.map(week=>week.map(pair=>{

  ["ptd","Passing TD",4],["pyd","Passing yard",0.04],["int","Interception",-2],

  const el=document.getElementById("sc-show"); if(el)el.innerHTML='<h3>Current</h3>'+fields.map(f=>'<div>'+f[1]+': '+(v[f[0]]!=null?v[f[0]]:f[2])+'</div>').join("");
});

if(b) b.onclick=()=>{if(!load().owner)return; const out={}; fields.forEach(f=>out[f[0]]=Number(document.getElementById("sc-"+f[0]).value)||0); dataRef("config/scoring").set(out);};

function applyPreset(val){
  const el=document.getElementById("sc-rec");
  if(el) el.value=val;
  const show=document.getElementById("sc-show");
  if(show){
    const recLine=show.innerHTML.split("<div>").find(x=>x.includes("Reception"));
    if(recLine) show.innerHTML=show.innerHTML.replace(recLine, "Reception (PPR): "+val+"</div>");
  }
}
const ppr=document.getElementById("preset-ppr"); if(ppr) ppr.onclick=()=>applyPreset(1);
const half=document.getElementById("preset-half"); if(half) half.onclick=()=>applyPreset(0.5);
const std=document.getElementById("preset-std"); if(std) std.onclick=()=>applyPreset(0);

}

function waiverState(){const s=load(); if(!s.records)s.records={}; return s;}
function saveWaiver(s){save(s); try{dataRef("config/waiver").set({deadline:s.records.waiverDeadline||"", claims:s.records.claims||[]});}catch(e){}}
function renderWaiver(){
  const s=waiverState();
  const rec=s.records;
  const deadline=rec.waiverDeadline||"";
  const closed=!!(deadline && Date.now()>new Date(deadline).getTime());
  const claims=rec.claims||[];
  const taken=new Set(claims.map(c=>c.id));
  const free=PLAYERS.filter(p=>!taken.has(p.id));
  const q=rec.waiverQ||"";
  const shown=free.filter(p=>!q||(p.name||"").toLowerCase().includes(q.toLowerCase())).slice(0,40);
  document.getElementById("app").innerHTML=header('<a class="btn" href="#home">Home</a>')+'<div class="page"><div class="eyebrow">'+(closed?"FREE AGENTS":"WAIVER")+'</div><h1>'+(closed?"Waiver cleared. Free agent pickups.":"Claims close at the deadline.")+'</h1>'+(s.owner?'<div class="card"><label>Deadline</label><input id="waiver-deadline" class="search" type="datetime-local" value="'+deadline+'"><button class="btn btn-lime" type="button" onclick="saveWaiverDeadline()">Save deadline</button><p id="waiver-note"></p></div>':'')+'<div class="card"><p>'+(deadline?(closed?"Players have cleared waivers.":"Open until "+deadline):"No deadline yet.")+'</p><input id="waiver-q" class="search" placeholder="Find a player" value="'+q+'" oninput="filterWaiver(this.value)"><table><tr><th>Player</th><th></th></tr>'+shown.map(pl=>'<tr><td>'+pl.name+' · '+pl.pos+'</td><td><button class="btn" type="button" onclick="addWaiver('+pl.id+')">'+(closed?"Pick up":"Add")+'</button></td></tr>').join("")+'</table></div><div class="card"><h2>'+(closed?"Pickups":"Claims")+'</h2>'+(claims.map(c=>'<div class="log-item">'+c.player+'</div>').join("")||'<p>None yet.</p>')+'</div></div>';
}
function saveWaiverDeadline(){const s=waiverState(); if(!s.owner){alert("Unlock first."); return;} s.records.waiverDeadline=document.getElementById("waiver-deadline").value; saveWaiver(s); renderWaiver();}
function filterWaiver(v){const s=waiverState(); s.records.waiverQ=v; save(s); renderWaiver();}
function addWaiver(id){const s=waiverState(); const rec=s.records; const closed=!!(rec.waiverDeadline && Date.now()>new Date(rec.waiverDeadline).getTime()); const player=PLAYERS.find(p=>p.id===Number(id)); if(!player){alert("Player not found."); return;} rec.claims=rec.claims||[]; if(rec.claims.some(c=>c.id===player.id))return; rec.claims.unshift({id:player.id, player:player.name, kind:closed?"fa":"waiver", at:Date.now()}); saveWaiver(s); renderWaiver();}



function renderRoster(){
  try{
  const s=load();
  const colors={QB:"#e85d4c",RB:"#3d9a6a",WR:"#3d7ea6",TE:"#c9842a",K:"#7a6bb5",DEF:"#5c6b7a"};
  const mine=s.actingAs||{};
  const rs = rosterSettings;
  const total = (Number(rs.qb)||0)+(Number(rs.rb)||0)+(Number(rs.wr)||0)+(Number(rs.te)||0)+(Number(rs.teamDef)||0)+(Number(rs.defPlayers)||0)+(Number(rs.k)||0)+(Number(rs.flex)||0)+(Number(rs.bench)||0);
  let html="";
  podsOf(s).forEach(pod=>{
    const d=ensureDraft(s,pod);
    (d.teams||[]).forEach(team=>{
      const picks=team.picks||[];
      if(!picks.length) return;
      const row=(s.records&&s.records.rows||{})[pod+"-"+team.id]||{w:0,l:0,pf:0};
      const mineHere = canEditTeam(s, pod, team.id);
      const lineup = team.lineup || {starters:[], bench:[], ir:[]}; lineup.starters = lineup.starters || []; lineup.bench = lineup.bench || []; lineup.ir = lineup.ir || [];
      // simple auto-fill if empty
      if(!(lineup.starters||[]).length && (picks||[]).length){
        lineup.starters = picks.slice(0, total);
        lineup.bench = picks.slice(total);
      }
      const override = s.owner && (localStorage.getItem("dualgrid-override-"+pod+"-"+team.id)==="1");
      html+='<div class="card" style="background:linear-gradient(160deg,#14233a,#0d1524);color:#fff;border-left:8px dashed #c9a227"><div class="eyebrow">SEASON TICKET · '+podName(pod).toUpperCase()+'</div><h2 style="font-size:28px;margin:6px 0">'+(team.name||"Team")+'</h2><p>'+(team.ownerName||"Owner")+(mineHere?" · you":"")+'</p><p style="font-size:20px;letter-spacing:1px">'+(row.w||0)+'-'+(row.l||0)+' · '+(row.pf||0)+' PF</p><p style="opacity:.7">Seat '+(team.id+1)+' · '+ (s.season||"2026")+' · Roster '+total+' + '+(rs.ir||1)+' IR</p>'+(s.owner?'<label style="display:flex;align-items:center;gap:8px;margin-top:10px"><input type="checkbox" data-override="'+pod+'-'+team.id+'" '+(override?"checked":"")+'> Commissioner override</label>':'')+'</div>';
      const starters = Array.isArray(lineup.starters) ? lineup.starters : [];
      const bench = Array.isArray(lineup.bench) ? lineup.bench : [];
      const ir = Array.isArray(lineup.ir) ? lineup.ir : [];
      html+='<div class="card"><h3>Starters</h3>'+starters.map(pl=>'<div class="log-item" style="border-left:6px solid '+(colors[pl.pos]||"#999")+'"><b>'+(pl.pos||"?")+'</b> · '+(pl.name||"Player")+((mineHere||override)?' <button class="btn" data-move="bench" data-id="'+pl.id+'" data-pod="'+pod+'" data-team="'+team.id+'">Bench</button>':"")+'</div>').join("")+'</div>';
      html+='<div class="card"><h3>Bench</h3>'+bench.map(pl=>'<div class="log-item"><b>'+(pl.pos||"?")+'</b> · '+(pl.name||"Player")+((mineHere||override)?' <button class="btn" data-move="starter" data-id="'+pl.id+'" data-pod="'+pod+'" data-team="'+team.id+'">Start</button> <button class="btn" data-move="ir" data-id="'+pl.id+'" data-pod="'+pod+'" data-team="'+team.id+'">IR</button>':"")+'</div>').join("")+'</div>';
      html+='<div class="card"><h3>IR</h3>'+ir.map(pl=>'<div class="log-item"><b>'+(pl.pos||"?")+'</b> · '+(pl.name||"Player")+((mineHere||override)?' <button class="btn" data-move="bench" data-id="'+pl.id+'" data-pod="'+pod+'" data-team="'+team.id+'">Bench</button>':"")+'</div>').join("")+'</div>';
    });
  });
  const settings = s.owner ? '<div class="card no-print"><h3>Roster settings</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px"><div><label>QB</label><input id="rs-qb" type="number" value="'+(rs.qb||1)+'"></div><div><label>RB</label><input id="rs-rb" type="number" value="'+(rs.rb||2)+'"></div><div><label>WR</label><input id="rs-wr" type="number" value="'+(rs.wr||2)+'"></div><div><label>TE</label><input id="rs-te" type="number" value="'+(rs.te||1)+'"></div><div><label>Team DEF</label><input id="rs-teamDef" type="number" value="'+(rs.teamDef||0)+'"></div><div><label>Def players</label><input id="rs-defPlayers" type="number" value="'+(rs.defPlayers||0)+'"></div><div><label>K</label><input id="rs-k" type="number" value="'+(rs.k||1)+'"></div><div><label>FLEX</label><input id="rs-flex" type="number" value="'+(rs.flex||1)+'"></div><div><label>Bench</label><input id="rs-bench" type="number" value="'+(rs.bench||6)+'"></div><div><label>IR</label><input id="rs-ir" type="number" value="'+(rs.ir||1)+'"></div></div><button class="btn btn-lime" id="save-roster" style="margin-top:12px">Save roster settings</button><p style="margin-top:10px;opacity:.7">Commissioner can edit any lineup. Owners can only edit their own team.</p></div>' : '<div class="card"><p>QB '+(rs.qb||1)+' · RB '+(rs.rb||2)+' · WR '+(rs.wr||2)+' · TE '+(rs.te||1)+' · Team DEF '+(rs.teamDef||0)+' · Def players '+(rs.defPlayers||0)+' · K '+(rs.k||1)+' · FLEX '+(rs.flex||1)+' · Bench '+(rs.bench||6)+' · IR '+(rs.ir||1)+'</p></div>';
  document.getElementById("app").innerHTML=header('<a class="btn" href="#home">Home</a>')+'<div class="page"><div class="eyebrow">ROSTER</div><h1>Lineups</h1>'+settings+(html||'<div class="card"><p>No picks yet. Draft first.</p></div>')+'</div>';
  const btn=document.getElementById("save-roster");
  if(btn) btn.onclick=()=>{
    if(!load().owner) return;
    rosterSettings = {
      qb: Number(document.getElementById("rs-qb").value)||0,
      rb: Number(document.getElementById("rs-rb").value)||0,
      wr: Number(document.getElementById("rs-wr").value)||0,
      te: Number(document.getElementById("rs-te").value)||0,
      teamDef: Number(document.getElementById("rs-teamDef").value)||0,
      defPlayers: Number(document.getElementById("rs-defPlayers").value)||0,
      k: Number(document.getElementById("rs-k").value)||0,
      flex: Number(document.getElementById("rs-flex").value)||0,
      bench: Number(document.getElementById("rs-bench").value)||0,
      ir: Number(document.getElementById("rs-ir").value)||0
    };
    publishRoster();
    alert("Roster settings saved.");
    renderRoster();
  };
  document.querySelectorAll("[data-move]").forEach(b=>{
    b.onclick=()=>{
      const id=Number(b.dataset.id);
      const to=b.dataset.move;
      const pod=b.dataset.pod;
      const tid=Number(b.dataset.team);
      const st=load();
      const overrideOn = localStorage.getItem("dualgrid-override-"+pod+"-"+tid)==="1"; if(!canEditTeam(st, pod, tid) && !(st.owner && overrideOn)){ alert("You can only edit your own lineup."); return; }
      const d=ensureDraft(st,pod);
      const team=d.teams[tid];
      if(!team) return;
      const all=team.picks||[];
      const pl=all.find(p=>Number(p.id)===id);
      if(!pl) return;
      team.lineup=team.lineup||{starters:[],bench:[],ir:[]};
      team.lineup.starters=(team.lineup.starters||[]).filter(p=>Number(p.id)!==id);
      team.lineup.bench=(team.lineup.bench||[]).filter(p=>Number(p.id)!==id);
      team.lineup.ir=(team.lineup.ir||[]).filter(p=>Number(p.id)!==id);
      if(to==="starter") team.lineup.starters.push(pl);
      else if(to==="ir") team.lineup.ir.push(pl);
      else team.lineup.bench.push(pl);
      save(st); publish(pod); renderRoster();
    };
  });
  document.querySelectorAll("[data-override]").forEach(cb=>{
    cb.onchange=()=>{
      const key="dualgrid-override-"+cb.dataset.override;
      localStorage.setItem(key, cb.checked?"1":"0");
      renderRoster();
    };
  });
  }catch(err){ console.error(err); document.getElementById('app').innerHTML='<div class="page"><h1>Roster page error</h1><pre style="color:#c6f25a">'+err.message+'</pre><a class="btn" href="#home">Home</a></div>'; }
}

function renderMatchup(){
const s=load(); if(!s.records)s.records={week:1,rows:{}};
const week=s.records.week||1;
const seat=JSON.parse(localStorage.getItem("dualgrid-my-seat")||"null") || (JSON.parse(localStorage.getItem("dualgrid-my-seats")||"{}")[leagueCode()]||null);
const schedule=seasonSchedule(s);
const games=schedule[week-1]||[];
if(!games.length){
  document.getElementById("app").innerHTML=header('<a class="btn" href="#home">Home</a>')+'<div class="page"><h1>Matchups</h1><p class="lede">No games scheduled for week '+week+' yet.</p></div>';
  return;
}
let list="";
games.forEach(g=>{
  const isMine = seat && g.pod===seat.pod && (Number(g.home.id)===Number(seat.teamId) || Number(g.away.id)===Number(seat.teamId));
  const highlight = isMine ? "border:2px solid #c6f25a;background:rgba(198,242,90,.08)" : "";
  const homePicks=(g.home.picks||[]).slice(0,12);
  const awayPicks=(g.away.picks||[]).slice(0,12);
  const max=Math.max(homePicks.length, awayPicks.length, 1);
  let rows="";
  for(let i=0;i<max;i++){
    const a=homePicks[i]||{name:"—",pos:""};
    const b=awayPicks[i]||{name:"—",pos:""};
    rows+='<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid #222"><div><div class="name">'+a.name+'</div><div class="sub">'+a.pos+'</div></div><div class="pos '+(a.pos||"")+'" style="min-width:36px;text-align:center">'+(a.pos||"")+'</div><div style="text-align:right"><div class="name">'+b.name+'</div><div class="sub">'+b.pos+'</div></div></div>';
  }
  list+='<details class="card" style="margin:10px 0;'+highlight+'"><summary style="font-weight:800;cursor:pointer;padding:4px 0">'+g.home.name+' vs '+g.away.name+(isMine?' <span style="color:#c6f25a">· YOU</span>':'')+'</summary><div style="margin-top:8px"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><strong>'+g.home.name+'</strong><span>vs</span><strong>'+g.away.name+'</strong></div>'+rows+'</div></details>';
});
document.getElementById("app").innerHTML=header('<a class="btn" href="#home">Home</a><a class="btn" href="#scoreboard">Scoreboard</a>')+
'<div class="page"><div class="eyebrow">WEEK '+week+' MATCHUPS</div><h1>All games</h1><p class="lede">Your team is highlighted. Tap a game to see the lineup.</p>'+list+'</div>';
}

function renderTrade(){
  const s = load() || {};
  if(!s.records) s.records = {};
  const trades = s.records.trades || [];
  const mode = s.records.tradeMode || "commish";
  const deadline = s.records.tradeDeadline || "Thursday 8:00 PM";
  const isCommish = !!s.owner;
  const seat = (typeof currentSeat === "function" ? currentSeat() : null) || {};
  let list = trades.map((t,i) => {
    const status = t.status || "pending";
    return '<div class="card" style="margin:8px 0"><strong>'+ (t.from||"Team") +' → '+ (t.to||"Team") +'</strong><div class="sub">'+ (t.picks||"Picks") +' · '+status+'</div>'+(isCommish && status==="pending" ? '<button class="btn btn-lime" onclick="approveTrade('+i+')">Approve</button> <button class="btn" onclick="rejectTrade('+i+')">Reject</button>' : '')+'</div>';
  }).join("") || "<p class=\"lede\">No pending trades.</p>";
  let form = "";
  if(seat.teamId != null){
    form = '<div class="card"><h3>Propose a trade</h3><label>Other team</label><input id="trade-to" class="search" placeholder="Team name"><label>Picks / players</label><input id="trade-picks" class="search" placeholder="e.g. 2027 1st for 2027 2nd"><button class="btn btn-lime" id="propose-trade" style="margin-top:8px">Propose</button></div>';
  }
  let settings = "";
  if(isCommish){
    const day = s.records.tradeDay || "Thursday";
  const time = s.records.tradeTime || "20:00";
  settings = '<div class="card"><h3>Trade settings</h3><label>How trades finalize</label><select id="trade-mode" class="search"><option value="commish"'+(mode==="commish"?" selected":"")+'>Commissioner only</option><option value="vote"'+(mode==="vote"?" selected":"")+'>League vote</option><option value="vote-commish"'+(mode==="vote-commish"?" selected":"")+'>League vote + commissioner</option></select><label>Deadline day</label><select id="trade-day" class="search"><option'+(day==="Sunday"?" selected":"")+'>Sunday</option><option'+(day==="Monday"?" selected":"")+'>Monday</option><option'+(day==="Tuesday"?" selected":"")+'>Tuesday</option><option'+(day==="Wednesday"?" selected":"")+'>Wednesday</option><option'+(day==="Thursday"?" selected":"")+'>Thursday</option><option'+(day==="Friday"?" selected":"")+'>Friday</option><option'+(day==="Saturday"?" selected":"")+'>Saturday</option></select><label>Deadline time</label><input id="trade-time" class="search" type="time" value="'+time+'"><button class="btn" id="save-trade-settings" style="margin-top:8px">Save settings</button></div>';
  }
  document.getElementById("app").innerHTML = header('<a class="btn" href="#home">Home</a>') +
    '<div class="page"><div class="eyebrow">TRADES</div><h1>Trade center</h1><p class="lede">Draft picks and players. Mode: '+mode+' · Deadline: '+deadline+'</p>'+settings+form+list+'</div>';
  const prop = document.getElementById("propose-trade");
  if(prop) prop.onclick = ()=>{
    const to = (document.getElementById("trade-to").value||"").trim();
    const picks = (document.getElementById("trade-picks").value||"").trim();
    if(!to || !picks){ alert("Fill both fields."); return; }
    const st = load();
    st.records.trades = st.records.trades || [];
    st.records.trades.push({ from: seat.name || "You", to, picks, status: "pending", time: Date.now() });
    save(st);
    try{ dataRef("config/trades").set(st.records.trades); }catch(e){}
    renderTrade();
  };
  const saveBtn = document.getElementById("save-trade-settings");
  if(saveBtn) saveBtn.onclick = ()=>{
    const st = load();
    st.records.tradeMode = document.getElementById("trade-mode").value;
    st.records.tradeDay = document.getElementById("trade-day").value;
    st.records.tradeTime = document.getElementById("trade-time").value;
    st.records.tradeDeadline = st.records.tradeDay + " " + st.records.tradeTime;
    save(st);
    try{ dataRef("config/tradeSettings").set({ mode: st.records.tradeMode, deadline: st.records.tradeDeadline }); }catch(e){}
    renderTrade();
  };
}
function approveTrade(i){
  const st = load();
  if(st.records.trades && st.records.trades[i]) st.records.trades[i].status = "approved";
  save(st);
  try{ dataRef("config/trades").set(st.records.trades); }catch(e){}
  renderTrade();
}
function rejectTrade(i){
  const st = load();
  if(st.records.trades && st.records.trades[i]) st.records.trades[i].status = "rejected";
  save(st);
  try{ dataRef("config/trades").set(st.records.trades); }catch(e){}
  renderTrade();
}

function route(){const page=(location.hash.replace("#","").split("/")[0]||"lobby"); const st=load(); if(!st.email && page!=="login"){ location.hash="#login"; return renderLogin(); } if(page==="login"){ return renderLogin(); } if(page!=="lobby"&&!leagueCode()&&page!=="draft"&&page!=="board"&&page!=="trade"){location.hash="#lobby"; return renderLobby();}if(page==="pay")renderPay();else if(page==="draft")renderDraft();else if(page==="board")renderBoard();else if(page==="wall")renderWall();else if(page==="payout"){ if(!unlocked(load())){ alert("Commissioner code required."); location.hash="#home"; return;} renderPayout(); }else if(page==="scores")renderScores();else if(page==="scoreboard")renderScoreboard();else if(page==="bracket")renderBracket();else if(page==="talk")renderTalk();else if(page==="waiver")renderWaiver();else if(page==="roster")renderRoster();else if(page==="history")renderHistory();else if(page==="scoring")renderScoring();else if(page==="matchup")renderMatchup();else if(page==="trade")renderTrade();else if(page==="dash")renderDash();else if(page==="lobby"||page==="")renderLobby();else renderHome();}
["east","west","north","south"].forEach(pod=>{dataRef("drafts/"+pod).on("value",snap=>{const remote=snap.val();if(!remote||!remote.teams)return;applyingRemote=true;const s=load();s.drafts[pod]=normalizeDraft(remote);save(s);applyingRemote=false;const page=(location.hash.replace("#","").split("/")[0]||"");const onPod=(location.hash.split("/")[1]||"")===(pod);if((page==="draft"||page==="board"||page==="dash")&&onPod&&window._paint)window._paint();});});
dataRef("records").on("value",snap=>{const remote=snap.val();if(!remote)return;applyingRemote=true;const s=load();s.records=remote;save(s);applyingRemote=false;if((location.hash||"").startsWith("#scores"))renderScores(); if((location.hash||"").startsWith("#bracket"))renderBracket();});
if(!window._draftTick){window._draftTick=setInterval(()=>{const h=location.hash||"";if(!(h.startsWith("#draft")||h.startsWith("#board")))return;const pod=podFromHash();const d=ensureDraft(load(),pod);const left=clockLeft(d);const el=document.querySelector(".timer");if(el)el.textContent=fmtTime(left);if(left<=0&&d.started&&d.pickIndex<ROUNDS*teamCount()&&load().owner&&!window._autoPick){window._autoPick=true;const best=bestAvailable(d);if(best)makePick(load(),pod,best.id);setTimeout(()=>{window._autoPick=false;},1500);}},250);}
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("#go-home"); if(!a)return; e.preventDefault(); location.hash="#home"; renderHome();});
document.addEventListener("click",e=>{if(e.target&&e.target.id==="menu-btn"){const n=document.querySelector(".nav-links"); if(n)n.classList.toggle("open");}});
document.addEventListener("click",e=>{if(e.target&&e.target.id==="logout-btn"){e.preventDefault(); const st=load(); st.email=""; delete st.email; save(st); localStorage.removeItem("dualgrid-email"); location.href=location.pathname+"?out="+Date.now();}});
document.addEventListener("click",e=>{const btn=e.target.closest&&e.target.closest("#logout-btn"); if(!btn)return; e.preventDefault(); const st=load(); delete st.email; st.email=""; save(st); location.replace(location.pathname+"#lobby");});
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
